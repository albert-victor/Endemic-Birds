<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Endemic Birds | Southern Tanzania Birding Safaris</title>
    <meta
      name="description"
      content="Iringa-based birding and wildlife safaris with Eastern Arc expertise, endemic-focused fieldcraft and ground support for private guests and international operators."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../assets/images/from-live-site/brand/bird-logo.png" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/clean-depth.css" />
    <link rel="stylesheet" href="../assets/css/site-enhancements.css" />
    <link rel="stylesheet" href="../assets/css/about-page.css" />
    <link rel="stylesheet" href="../assets/css/tour-calendar.css" />
  </head>
  <body class="has-grain" data-nav="about">
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="site-header"></div>
    <main id="main" data-about-page>
      <section class="page-hero is-visible" style="--page-hero-img: url('/assets/images/from-live-site/destinations/eastern-destination.jpg')">
        <div class="page-hero-scrim"></div>
        <div class="container page-hero-inner">
          <h1 class="page-hero-title reveal" data-reveal>Endemic Birds Tanzania</h1>
          <p class="page-hero-lead reveal" data-reveal data-about-intro-lead>
            From Iringa we design specialist birding and wildlife journeys – with Southern Tanzania, the Eastern Arc and miombo woodland at the heart of what we do.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <p class="section-lead about-intro reveal" data-reveal data-about-intro></p>
        </div>
      </section>

      <section class="section section--paper-band" aria-labelledby="about-approach-heading">
        <div class="container" data-about-approach></div>
      </section>

      <section class="about-story-band reveal" data-reveal aria-label="Who we are">
        <div class="about-story-band__bg" data-about-story-bg aria-hidden="true"></div>
        <div class="about-story-band__scrim" aria-hidden="true"></div>
        <div class="container about-story-band__inner">
          <p class="about-story-band__eyebrow">Who we are</p>
          <blockquote class="about-story-band__quote" data-about-story-quote></blockquote>
          <p class="about-story-band__cite" data-about-story-cite></p>
        </div>
      </section>

      <section class="about-wildlife-band section" data-about-wildlife-band aria-label="Wildlife capability"></section>

      <section class="about-leon-spotlight" aria-labelledby="about-leon-heading">
        <div class="about-leon-spotlight__glow" aria-hidden="true"></div>
        <div class="container about-leon-spotlight__grid reveal" data-reveal data-about-leon-teaser></div>
      </section>

      <section class="section section--paper-band" aria-labelledby="explore-team-heading">
        <div class="container" data-about-explore-hub></div>
      </section>

      <section class="section about-cal-teaser-section" aria-labelledby="calendar-teaser-heading">
        <div class="container about-cal-teaser reveal" data-reveal data-about-calendar-teaser></div>
      </section>

      <section class="section section--paper-band about-gallery-full about-gallery-viewport" id="about-gallery">
        <div class="container">
          <header class="about-gallery-head reveal" data-reveal>
            <h2 class="section-title">Safari gallery</h2>
            <p class="section-lead">Moments from the field – migration, forests, coast and open country.</p>
          </header>
          <div class="about-gallery__grid about-gallery__grid--mosaic reveal" data-reveal data-about-gallery-full></div>
          <p class="about-gallery__actions reveal" data-reveal>
            <button type="button" class="btn btn-outline" data-about-gallery-toggle hidden>Show all photos</button>
          </p>
        </div>
      </section>

      <section class="section section--cta-band" id="contact" data-about-enquiries></section>
    </main>
    <div id="site-footer"></div>
    <script>window.__ASSET_PREFIX__ = "../";</script>
    <script src="../assets/js/layout.js" defer></script>
    <script src="../assets/js/site-search.js" defer></script>
    <script src="../assets/js/motion.js" defer></script>
    <script src="../assets/js/about-content.js" defer></script>
    <script src="../assets/js/main.js" defer></script>
  </body>
</html>
