<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rest along the journey | Safari accommodation | Endemic Birds Tanzania</title>
    <meta
      name="description"
      content="Discover lodges, forest camps and remote expedition stays on Endemic Birds routes – editorial listing for safari planning, not hotel booking."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Marck+Script&display=swap" rel="stylesheet" />
    <link rel="icon" href="../assets/images/from-live-site/brand/bird-logo.png" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/site-enhancements.css" />
  </head>
  <body class="has-grain" data-nav="accommodations">
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="site-header"></div>
    <main id="main">
      <section class="section accommodation-landing accommodation-landing--premium" style="padding-top: 7rem">
        <div class="container catalog-page accommodation-catalog-page">
          <p class="accommodation-landing__script display-script">Safari stays</p>
          <h1 class="visually-hidden">Accommodation</h1>

          <form class="acc-filters" data-accommodation-filters aria-label="Filter safari stays">
            <label class="acc-filters__field">Circuit / location
              <select name="circuit" class="acc-filters__select">
                <option value="all">All</option>
                <option value="Northern">Northern</option>
                <option value="Southern">Southern</option>
                <option value="Eastern">Eastern</option>
                <option value="Western">Western</option>
                <option value="North West">North West</option>
              </select>
            </label>
            <label class="acc-filters__field">Comfort level
              <select name="comfort" class="acc-filters__select">
                <option value="all">Any</option>
                <option value="budget">Budget</option>
                <option value="mid-range">Mid-range / premium</option>
                <option value="luxury">Luxury</option>
              </select>
            </label>
            <label class="acc-filters__field">Property type
              <select name="propertyType" class="acc-filters__select">
                <option value="all">Any</option>
                <option value="lodge">Lodge</option>
                <option value="tented-camp">Tented camp</option>
                <option value="campsite">Campsite</option>
                <option value="villa">Villa</option>
                <option value="bush-retreat">Bush retreat</option>
              </select>
            </label>
            <button type="button" class="acc-filters__reset" data-clear-filters>Reset filters</button>
          </form>

          <p class="accommodation-inventory-note" data-filter-status role="status"></p>

          <div data-accommodation-catalog class="accommodation-catalog">
            <p class="catalog-meta"><span data-count>0</span> stays</p>
            <div data-accommodation-grid></div>
            <p class="catalog-empty" data-empty hidden>No stays match – reset filters or browse all.</p>
          </div>

          <header class="accommodation-intro-bottom reveal" data-reveal>
            <p class="eyebrow">The places we stay</p>
            <h2 class="section-title">Rest along the journey</h2>
            <p class="section-lead">
              From welcoming safari lodges to remote forest camps, discover the places that make every birding journey through Tanzania a memorable experience.
            </p>
          </header>

          <div data-accommodation-planning></div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script>window.__ASSET_PREFIX__ = "../";</script>
    <script src="../assets/js/endemic-media.js" defer></script>
    <script src="../assets/js/package-visits.js" defer></script>
    <script src="../assets/js/ui-cards.js" defer></script>
    <script src="../assets/js/layout.js" defer></script>
    <script src="../assets/js/site-search.js" defer></script>
    <script src="../assets/js/motion.js" defer></script>
    <script src="../assets/js/acc-card-slideshow.js" defer></script>
    <script src="../assets/js/accommodation-catalog.js" defer></script>
    <script src="../assets/js/main.js" defer></script>
  </body>
</html>
