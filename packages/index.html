<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Safaris &amp; Birding Journeys | Endemic Birds</title>
    <meta name="description" content="Search and filter birding, wildlife and combined safaris across Tanzania." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Marck+Script&display=swap" rel="stylesheet" />
    <link rel="icon" href="../assets/images/from-live-site/brand/bird-logo.png" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="has-grain" data-nav="birding">
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="site-header"></div>
    <main id="main">
      <section class="section" style="padding-top: 7rem">
        <div class="container">
          <p class="eyebrow">All journeys</p>
          <h1 class="section-title">Safari &amp; birding journeys</h1>
          <p class="section-lead">Browse tailor-made routes – filter by experience, duration, destination or circuit.</p>
          <form class="filters-bar" data-filters>
            <label>Experience
              <select name="category">
                <option value="all">All</option>
                <option value="birding">Birding-focused</option>
                <option value="wildlife">Wildlife-focused</option>
                <option value="combined">Birding + Wildlife</option>
              </select>
            </label>
            <label>Duration
              <select name="duration">
                <option value="all">Any</option>
                <option value="short">Up to 10 days</option>
                <option value="medium">11–16 days</option>
                <option value="long">17+ days</option>
              </select>
            </label>
            <label>Destination
              <select name="destination">
                <option value="all">All</option>
                <option value="northern">Northern</option>
                <option value="southern">Southern</option>
                <option value="eastern-arc">Eastern Arc</option>
                <option value="western">Western</option>
                <option value="north-west">North West</option>
                <option value="eastern">Eastern</option>
              </select>
            </label>
            <label>Circuit
              <select name="circuit">
                <option value="all">All</option>
                <option value="Northern">Northern</option>
                <option value="Southern">Southern</option>
                <option value="Eastern">Eastern</option>
                <option value="Western">Western</option>
                <option value="North West">North West</option>
              </select>
            </label>
            <button type="button" class="btn btn-outline" data-clear-filters>Clear filters</button>
          </form>
          <div data-catalog="packages" data-layout="bento">
            <div class="catalog-bento-wrap" data-catalog-bento></div>
            <p class="catalog-meta"><span data-count>0</span> journeys</p>
            <div data-catalog-list></div>
            <p class="catalog-empty" data-empty hidden>No journeys match – try clearing filters.</p>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script>window.__ASSET_PREFIX__ = "../";</script>
    <script src="../assets/js/package-visits.js" defer></script>
    <script src="../assets/js/ui-cards.js" defer></script>
    <script src="../assets/js/layout.js" defer></script>
    <script src="../assets/js/site-search.js" defer></script>
    <script src="../assets/js/motion.js" defer></script>
    <script src="../assets/js/scroll-gallery.js" defer></script>
    <script src="../assets/js/catalog.js" defer></script>
    <script src="../assets/js/main.js" defer></script>
  </body>
</html>
