<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dest spot panel check</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/card-alts.css" />
    <style>
      body {
        margin: 0;
        padding: 1.25rem;
        background: #ebe6dc;
      }
      .demo-note {
        max-width: 22rem;
        margin: 0 0 1rem;
        font-size: 0.85rem;
        line-height: 1.45;
        color: #3c3935;
      }
      .alt-card-grid--dest-spot {
        max-width: 340px;
      }
    </style>
  </head>
  <body>
    <p class="demo-note">Destination cards – white panel hangs slightly below the photo (same offset on every card). Not wired to the site.</p>
    <div class="alt-card-grid alt-card-grid--dest-spot">
      <a class="dest-ind-spot" href="#">
        <div class="dest-ind-spot__frame">
          <div class="dest-ind-spot__photo">
            <div class="dest-ind-spot__img card-media-wrap is-loaded">
              <img src="https://images.unsplash.com/photo-1516426122078-c23e76319801?w=800&q=80" alt="" width="800" height="980" />
            </div>
            <span class="dest-ind-spot__tag">National park</span>
            <span class="dest-ind-spot__like" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.7-10-9.2C.2 8.5 2.4 5.5 6 5.5c2.2 0 3.6 1.1 4.5 2.3.9-1.2 2.3-2.3 4.5-2.3 3.6 0 5.8 3 4 6.3C19.5 16.3 12 21 12 21z"/></svg>
            </span>
            <div class="dest-ind-spot__cap">
              <h3 class="dest-ind-spot__title">NGORONGORO<br class="dest-ind-spot__title-br" aria-hidden="true" />CONSERVATION AREA</h3>
              <span class="dest-ind-spot__cta">Explore destination <span aria-hidden="true">→</span></span>
            </div>
          </div>
        </div>
      </a>
      <a class="dest-ind-spot" href="#">
        <div class="dest-ind-spot__frame">
          <div class="dest-ind-spot__photo">
            <div class="dest-ind-spot__img card-media-wrap is-loaded">
              <img src="https://images.unsplash.com/photo-1551632436-925011177000?w=800&q=80" alt="" width="800" height="980" />
            </div>
            <span class="dest-ind-spot__tag">National park</span>
            <span class="dest-ind-spot__like" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.7-10-9.2C.2 8.5 2.4 5.5 6 5.5c2.2 0 3.6 1.1 4.5 2.3.9-1.2 2.3-2.3 4.5-2.3 3.6 0 5.8 3 4 6.3C19.5 16.3 12 21 12 21z"/></svg>
            </span>
            <div class="dest-ind-spot__cap">
              <h3 class="dest-ind-spot__title">MIKUMI<br class="dest-ind-spot__title-br" aria-hidden="true" />NATIONAL PARK</h3>
              <span class="dest-ind-spot__cta">Explore destination <span aria-hidden="true">→</span></span>
            </div>
          </div>
        </div>
      </a>
    </div>
  </body>
</html>
